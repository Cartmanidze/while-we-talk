[package]
name = "sobesednik"
version = "0.2.1"
description = "Local speech transcription and subscription-based assistance"
edition = "2021"

[lib]
name = "sobesednik_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "=2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
jsonwebtoken = "9"
subtle = "2"
wasapi = "0.27"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
strip = true
lto = "thin"
